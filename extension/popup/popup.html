<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 320px;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #f5f4ff;
        padding: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }
      .brand-mark {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: #5b3df5;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 12px;
      }
      .brand-name {
        font-size: 16px;
        font-weight: 700;
      }
      .brand-name .hire {
        color: #1bd29c;
      }
      .brand-name .lane {
        color: #5b3df5;
      }
      .card {
        background: white;
        border: 1px solid #f0f0f4;
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 10px;
      }
      .status-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #6b7280;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .btn {
        width: 100%;
        height: 38px;
        border-radius: 10px;
        border: none;
        background: #5b3df5;
        color: white;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-secondary {
        background: white;
        color: #5b3df5;
        border: 1px solid #e0e0ea;
      }
      #fieldCount {
        font-size: 11px;
        color: #9ca3af;
        margin-top: 8px;
        text-align: center;
      }
      #connectSection,
      #mainSection,
      #confirmSection {
        display: none;
      }

      label {
        display: block;
        font-size: 10px;
        font-weight: 600;
        color: #9ca3af;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 4px;
        margin-top: 10px;
      }
      label:first-of-type {
        margin-top: 0;
      }
      input,
      select {
        width: 100%;
        height: 32px;
        border: 1px solid #e0e0ea;
        border-radius: 8px;
        padding: 0 8px;
        font-size: 12px;
        font-family: inherit;
        outline: none;
      }
      input:focus,
      select:focus {
        border-color: #5b3df5;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <div class="brand-mark">H</div>
      <div class="brand-name">
        <span class="hire">Hire</span><span class="lane">Lane</span>
      </div>
    </div>

    <div id="connectSection" class="card">
      <p style="font-size: 12px; color: #6b7280; margin-bottom: 10px">
        Connect your HireLane account to start autofilling applications.
      </p>
      <button id="connectBtn" class="btn">Connect Account</button>
    </div>

    <div id="mainSection">
      <div class="card">
        <div class="status-row">
          <span class="dot" id="atsDot" style="background: #e0e0ea"></span>
          <span id="atsStatus">Checking page...</span>
        </div>
      </div>
      <div class="card">
        <button id="startFillBtn" class="btn" disabled>Fill Application</button>
      </div>
      <button id="disconnectBtn" class="btn btn-secondary">Disconnect</button>
    </div>

    <!-- NEW: confirmation form — shown before any actual filling happens -->
    <div id="confirmSection" class="card">
      <p
        style="
          font-size: 12px;
          color: #374151;
          margin-bottom: 4px;
          font-weight: 600;
        "
      >
        Confirm application details
      </p>
      <p style="font-size: 10px; color: #9ca3af; margin-bottom: 8px">
        We'll use this to log your application correctly.
      </p>

      <label>Company</label>
      <input type="text" id="companyInput" placeholder="e.g. Stripe" />

      <label>Role</label>
      <input
        type="text"
        id="roleInput"
        placeholder="e.g. Software Engineer II"
      />

      <label>ATS Platform</label>
      <select id="atsInput">
        <option value="workday">Workday</option>
        <option value="greenhouse">Greenhouse</option>
        <option value="lever">Lever</option>
        <option value="internshala">Internshala</option>
        <option value="naukri">Naukri</option>
        <option value="other">Other</option>
      </select>

      <div
        id="sessionResetRow"
        style="display: none; margin-top: 8px; margin-bottom: 4px"
      >
        <button
          id="resetSessionBtn"
          type="button"
          style="
            background: none;
            border: none;
            color: #5b3df5;
            font-size: 10px;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
          "
        >
          Not the same application? Start fresh
        </button>
      </div>

      <label>Expected CTC (optional, LPA)</label>
      <input type="number" id="ctcInput" placeholder="e.g. 18" />

      <button id="confirmFillBtn" class="btn">Continue &amp; Fill</button>
      <button id="cancelConfirmBtn" class="btn btn-secondary">Cancel</button>

      <div id="fieldCount"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
